[package]
name = "wfa-system"
version = "1.0.0"
description = "WFA System - Luzie Group: aplikasi desktop (absensi, to-do, zoom, performa, dan time tracking)"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
user-idle = "0.6"
xcap = "0.7"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
base64 = "0.22"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
